openapi: 3.0.4
info:
  title: Swagger RESP API JSON Персональный умный дом
  description: "API для сервера персонального умного дома"
  version: 1.0.0
paths:
  /:
    get:
      tags:
        - sensors
      summary: Get all house sensors
      description: getting all sensors
      operationId: getAllSensors
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSensorResponse'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - sensor
      summary: Create sensor
      description: Add a new sensor.
      operationId: createSensor
      requestBody:
        description: Create a new sensor
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSensorRequest'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSensorResponse'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /{id}:
    get:
      tags:
        - sensors
      summary: Get sensor by id
      description: getting sensor by id
      operationId: getSensorByID
      parameters:
        - name: id
          in: path
          description: id sensor
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSensorResponse'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateSensor
      tags:
        - sensors
      parameters:
        - name: id
          in: path
          description: id sensor
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSensorResponse'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSensorResponse'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteSensor
      tags:
        - sensors
      parameters:
        - name: id
          in: path
          description: id sensor
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /{id}/value:
    patch:
      operationId: patchSensor
      tags:
        - sensors
      parameters:
        - name: id
          in: path
          description: id sensor
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSensorRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /temperature/{location}:
    get:
      operationId: getTemperatureOnLocation
      parameters:
        - name: location
          in: path
          required: true
          schema:
            type: string
            example: "bedroom"
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTemperatureOnLocation'
        '400':
          description: Invalid data
        '404':
          description: Sensors not found
        '500':
          description: Internal error
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    GetTemperatureOnLocation:
      required: [ location, value, unit, timestamp, description ]
      type: object
      properties:
        location:
          type: string
          example: "bedroom"
        value:
          type: number
          format: double
          example: 17
        unit:
          type: string
        timestamp:
          type: string
          example: "2021-12-00T00:00:00.630098Z"
        description:
          type: string
    PatchSensorRequest:
      required: [ value, status ]
      type: object
      properties:
        value:
          type: number
          format: double
          example: 17
        status:
          type: string
          example: "off"
    UpdateSensorRequest:
      required: [ name, type, location, unit, status ]
      type: object
      properties:
        name:
          type: string
          example: sensor-1
        type:
          type: string
          example: "temperature"
        location:
          type: string
          example: "minsk pobediteley 10"
        value:
          type: number
          format: double
          example: 17
        unit:
          type: string
        status:
          type: string
          example: "off"
    GetSensorResponse:
      required: [ id, name, type, location, value, unit, status, last_updated, created_at ]
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        name:
          type: string
          example: sensor-1
        type:
          type: string
          example: "temperature"
        location:
          type: string
          example: "bedroom"
        value:
          type: number
          format: double
          example: 17
        unit:
          type: string
        status:
          type: string
          example: "off"
        last_updated:
          type: string
          example: "2021-12-00T00:00:00.630098Z"
        created_at:
          type: string
          example: "2021-12-00T00:00:00.630098Z"
    CreateSensorRequest:
      required: [ name, type, location, unit ]
      type: object
      properties:
        name:
          type: string
          example: sensor-1
        type:
          type: string
          example: "temperature"
        location:
          type: string
          example: "minsk pobediteley 10"
        unit:
          type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message